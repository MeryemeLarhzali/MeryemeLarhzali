name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # tous les jours à minuit (UTC)
  workflow_dispatch:       # bouton "Run workflow" manuel
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e879f9&color_dots=#161b22,#3b0764,#6b21a8,#a855f7,#e879f9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
